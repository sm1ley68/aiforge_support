[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aisupport-ml"
version = "0.1.0"
description = "Investigation and storefront support modules for AISupportAgent"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["aisupport_ml*"]

[project.optional-dependencies]
catalog = ["lxml>=5"]
retrieval = ["sentence-transformers>=5.2,<6"]
ollama = ["httpx>=0.27,<1"]
polza = ["httpx>=0.27,<1"]
