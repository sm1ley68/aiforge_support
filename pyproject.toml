[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aisupport-ml"
version = "0.1.0"
description = "Read-only investigation module for AISupportAgent"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["aisupport_ml*"]

[project.optional-dependencies]
ollama = ["httpx>=0.27,<1"]
polza = ["httpx>=0.27,<1"]
