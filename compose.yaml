x-backend: &backend
  build: .
  user: ${SOFTLINE_DOCKER_USER:-app}
  environment: &backend-env
    DATABASE_URL: postgresql://softline:softline@db:5432/softline
    CATALOG_INDEX_PATH: ${CATALOG_INDEX_PATH:-}
    COMMERCE_CATALOG_INDEX_PATH: ${COMMERCE_CATALOG_INDEX_PATH:-}
    COMMERCE_MODEL_PROFILE: ${COMMERCE_MODEL_PROFILE:-polza}
    COMMERCE_VERIFY_SITE_CARD: ${COMMERCE_VERIFY_SITE_CARD:-real}
    COMMERCE_OLLAMA_ENDPOINT: ${COMMERCE_OLLAMA_ENDPOINT:-http://host.docker.internal:11434/api/chat}
    POLZA_EGRESS_MODE: ${POLZA_EGRESS_MODE:-disabled}
    POLZA_API_KEY: ${POLZA_API_KEY:-}
    POLZA_TASK_MODEL: ${POLZA_TASK_MODEL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
  volumes:
    - &catalog-mount
      type: bind
      source: ${CATALOG_DIR:-./fixtures}
      target: /catalog
      read_only: true

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: softline
      POSTGRES_USER: softline
      POSTGRES_PASSWORD: softline
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U softline -d softline"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    environment:
      <<: *backend-env
      MANAGER_TOKEN: ${MANAGER_TOKEN:-}
      SUPPORT_HOURS_START: ${SUPPORT_HOURS_START:-}
      SUPPORT_HOURS_END: ${SUPPORT_HOURS_END:-}
      SUPPORT_WEEKDAYS: ${SUPPORT_WEEKDAYS:-1,2,3,4,5}
      SUPPORT_TIMEZONE: ${SUPPORT_TIMEZONE:-Europe/Moscow}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      STORE_ADVISOR_DIST_PATH: ${STORE_ADVISOR_DIST_PATH:-}
    volumes:
      - *catalog-mount
      - type: bind
        source: ${STORE_ADVISOR_DIST_DIR:-./fixtures}
        target: /advisor-dist
        read_only: true
    command: ["sh", "-c", "python -m softline_backend && exec uvicorn softline_backend.api:app_from_env --factory --host 0.0.0.0"]
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: ["python", "-m", "softline_backend.worker"]
    depends_on:
      api:
        condition: service_healthy

  catalog-refresh:
    build: .
    profiles: ["catalog-refresh"]
    user: ${SOFTLINE_DOCKER_USER:-app}
    environment:
      COMMERCE_CATALOG_INDEX_PATH: ${COMMERCE_CATALOG_INDEX_PATH:-}
    volumes:
      - type: bind
        source: ${CATALOG_DIR:-./fixtures}
        target: /catalog
    command: ["python", "-m", "softline_backend.catalog_refresh", "--daily"]
    restart: unless-stopped

volumes:
  postgres-data:
